<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COFRAP — Authentification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:       #f0f2f5;
            --surface:  #ffffff;
            --border:   #e0e3ea;
            --accent:   #1a56db;
            --accent-h: #1648c0;
            --success:  #1a7f4b;
            --success-bg: #ecfdf5;
            --error:    #b91c1c;
            --error-bg: #fef2f2;
            --info:     #1e40af;
            --info-bg:  #eff6ff;
            --text:     #111827;
            --muted:    #6b7280;
            --radius:   10px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.3px;
        }

        .header p {
            font-size: 13px;
            color: var(--muted);
            margin-top: 4px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 4px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
        }

        .tab-btn {
            flex: 1;
            padding: 9px;
            border: none;
            background: transparent;
            color: var(--muted);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
        }

        /* Card */
        .card {
            width: 100%;
            max-width: 400px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        .section { display: none; }
        .section.active { display: block; }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 20px;
        }

        /* Step badge */
        .step-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            color: var(--accent);
            background: var(--info-bg);
            border: 1px solid #bfdbfe;
            border-radius: 20px;
            padding: 3px 10px;
            margin-bottom: 14px;
        }

        /* Field */
        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 5px;
        }

        .field input {
            width: 100%;
            padding: 9px 12px;
            background: #f9fafb;
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }

        .field input:focus {
            border-color: var(--accent);
            background: #fff;
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 7px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 4px;
        }

        .btn:hover { background: var(--accent-h); }

        /* Messages */
        .msg {
            display: none;
            padding: 9px 13px;
            border-radius: 7px;
            font-size: 13px;
            margin-top: 10px;
        }

        .msg.succes { background: var(--success-bg); color: var(--success); border: 1px solid #a7f3d0; }
        .msg.erreur { background: var(--error-bg);   color: var(--error);   border: 1px solid #fecaca; }
        .msg.info   { background: var(--info-bg);    color: var(--info);    border: 1px solid #bfdbfe; }

        /* Divider */
        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 22px 0;
        }

        /* QR bloc */
        .qr-bloc {
            display: none;
        }

        .qr-wrap {
            text-align: center;
            margin-bottom: 16px;
        }

        .qr-wrap p {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .qr-wrap img {
            width: 150px;
            height: 150px;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px;
            background: #fff;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>COFRAP</h1>
        <p>Système d'authentification sécurisé</p>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('inscription', this)">Inscription</button>
        <button class="tab-btn"        onclick="switchTab('connexion', this)">Connexion</button>
    </div>

    <div class="card">

        <!-- ======================== -->
        <!-- INSCRIPTION              -->
        <!-- ======================== -->
        <div class="section active" id="section-inscription">

            <!-- Étape 1 -->
            <div class="step-badge">Étape 1 / 3</div>
            <div class="section-title">Créer un compte</div>

            <div class="field">
                <label>Nom d'utilisateur</label>
                <input type="text" id="username" placeholder="ex: jean.dupont">
            </div>

            <button class="btn" onclick="createUser()">Créer le compte</button>
            <div class="msg" id="msg-inscription"></div>

            <!-- Étape 2 : QR password -->
            <div class="qr-bloc" id="step-2">
                <hr class="divider">
                <div class="step-badge">Étape 2 / 3</div>
                <div class="qr-wrap">
                    <p>Scannez ce QR code pour récupérer votre mot de passe</p>
                    <img id="qr_password" src="" alt="QR mot de passe">
                </div>

                <div class="field">
                    <label>Mot de passe (scanné)</label>
                    <input type="text" id="password" placeholder="Collez votre mot de passe ici">
                </div>

                <button class="btn" onclick="validerPassword()">Valider le mot de passe</button>
                <div class="msg" id="msg-password"></div>
            </div>

            <!-- Étape 3 : QR 2FA -->
            <div class="qr-bloc" id="step-3">
                <hr class="divider">
                <div class="step-badge">Étape 3 / 3</div>
                <div class="qr-wrap">
                    <p>Scannez ce QR code avec Google Authenticator</p>
                    <img id="qr_2fa" src="" alt="QR 2FA">
                </div>

                <div class="field">
                    <label>Code 2FA</label>
                    <input type="text" id="code_2fa" placeholder="ex: 123456" maxlength="6">
                </div>

                <button class="btn" onclick="valider2FA()">Valider le code 2FA</button>
                <div class="msg" id="msg-2fa"></div>
            </div>

        </div>

        <!-- ======================== -->
        <!-- CONNEXION                -->
        <!-- ======================== -->
        <div class="section" id="section-connexion">

            <!-- Étape 1 -->
            <div class="step-badge">Étape 1 / 2</div>
            <div class="section-title">Se connecter</div>

            <div class="field">
                <label>Nom d'utilisateur</label>
                <input type="text" id="l_username" placeholder="ex: jean.dupont">
            </div>

            <div class="field">
                <label>Mot de passe</label>
                <input type="password" id="l_password" placeholder="Votre mot de passe">
            </div>

            <button class="btn" onclick="login1()">Se connecter</button>
            <div class="msg" id="msg-login"></div>

            <!-- Étape 2 : QR 2FA connexion -->
            <div class="qr-bloc" id="step-login-2">
                <hr class="divider">
                <div class="step-badge">Étape 2 / 2</div>
                <div class="qr-wrap">
                    <p>Scannez ce QR code avec Google Authenticator</p>
                    <img id="qr_login_2fa" src="" alt="QR 2FA connexion">
                </div>

                <div class="field">
                    <label>Code 2FA</label>
                    <input type="text" id="l_code" placeholder="ex: 123456" maxlength="6">
                </div>

                <button class="btn" onclick="login2()">Valider</button>
                <div class="msg" id="msg-login-2fa"></div>
            </div>

        </div>

    </div>

<script>

    // SCRUM-48 : URL centralisée
    const API_URL = "http://127.0.0.1:8000"

    let currentUser = ""

    // Gestion des onglets
    function switchTab(tab, btn) {
        document.querySelectorAll(".section").forEach(s => s.classList.remove("active"))
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"))
        document.getElementById("section-" + tab).classList.add("active")
        btn.classList.add("active")
    }

    // SCRUM-49 : messages
    function afficherMessage(id, texte, type) {
        let el = document.getElementById(id)
        el.textContent = texte
        el.className = "msg " + type
        el.style.display = "block"
    }

    function cacherMessage(id) {
        document.getElementById(id).style.display = "none"
    }

    function afficherBloc(id) {
        document.getElementById(id).style.display = "block"
    }

    // SCRUM-48 : appel API générique
    async function callAPI(endpoint, params) {
        let url = new URL(API_URL + endpoint)
        for (let key in params) url.searchParams.append(key, params[key])
        try {
            let res = await fetch(url, { method: "POST" })
            if (!res.ok) return { error: "Erreur serveur : " + res.status }
            return await res.json()
        } catch (err) {
            return { error: "Impossible de contacter le serveur. Vérifiez que le backend est lancé." }
        }
    }

    // SCRUM-45 : créer le compte
    async function createUser() {
        cacherMessage("msg-inscription")
        let username = document.getElementById("username").value
        if (username === "") { afficherMessage("msg-inscription", "Veuillez entrer un nom d'utilisateur.", "erreur"); return }

        currentUser = username
        afficherMessage("msg-inscription", "Création en cours...", "info")
        let data = await callAPI("/create-user", { username })
        if (data.error) { afficherMessage("msg-inscription", data.error, "erreur"); return }

        afficherMessage("msg-inscription", "Compte créé ! Scannez le QR code ci-dessous.", "succes")
        document.getElementById("qr_password").src = data.password_qr
        afficherBloc("step-2")
    }

    // SCRUM-46 : valider password → QR 2FA
    async function validerPassword() {
        cacherMessage("msg-password")
        let password = document.getElementById("password").value
        if (password === "") { afficherMessage("msg-password", "Veuillez entrer votre mot de passe.", "erreur"); return }

        afficherMessage("msg-password", "Vérification en cours...", "info")
        let data = await callAPI("/register-step2", { username: currentUser, password })
        if (data.error) { afficherMessage("msg-password", data.error, "erreur"); return }

        afficherMessage("msg-password", "Mot de passe validé ! Scannez le QR code 2FA.", "succes")
        document.getElementById("qr_2fa").src = data["2fa_qr"]
        afficherBloc("step-3")
    }

    // SCRUM-46 : valider code 2FA inscription
    async function valider2FA() {
        cacherMessage("msg-2fa")
        let code = document.getElementById("code_2fa").value
        if (code === "") { afficherMessage("msg-2fa", "Veuillez entrer le code 2FA.", "erreur"); return }

        afficherMessage("msg-2fa", "Vérification en cours...", "info")
        let data = await callAPI("/register-step3", { username: currentUser, code })
        if (data.error) { afficherMessage("msg-2fa", data.error, "erreur"); return }

        afficherMessage("msg-2fa", "✅ Compte activé avec succès !", "succes")
    }

    // SCRUM-47 : connexion étape 1
    async function login1() {
        cacherMessage("msg-login")
        let username = document.getElementById("l_username").value
        let password = document.getElementById("l_password").value
        if (username === "" || password === "") { afficherMessage("msg-login", "Veuillez remplir tous les champs.", "erreur"); return }

        afficherMessage("msg-login", "Connexion en cours...", "info")
        let data = await callAPI("/login-step1", { username, password })
        if (data.error) { afficherMessage("msg-login", data.error, "erreur"); return }

        afficherMessage("msg-login", "Mot de passe correct ! Scannez le QR code 2FA.", "succes")
        document.getElementById("qr_login_2fa").src = data["2fa_qr"]
        afficherBloc("step-login-2")
    }

    // SCRUM-47 : connexion étape 2
    async function login2() {
        cacherMessage("msg-login-2fa")
        let username = document.getElementById("l_username").value
        let code = document.getElementById("l_code").value
        if (code === "") { afficherMessage("msg-login-2fa", "Veuillez entrer le code 2FA.", "erreur"); return }

        afficherMessage("msg-login-2fa", "Vérification en cours...", "info")
        let data = await callAPI("/login-step2", { username, code })
        if (data.error) { afficherMessage("msg-login-2fa", data.error, "erreur"); return }

        afficherMessage("msg-login-2fa", "✅ Connexion réussie !", "succes")
    }

</script>
</html>
