<!DOCTYPE html>
<html>
<body>

<h2>Inscription</h2>
<input id="username">
<button onclick="createUser()">Créer</button>

<br><br>
<img id="qr_password" width="200">

<br><br>
<input id="password">
<button onclick="step2()">Valider password</button>

<br><br>
<img id="qr_2fa" width="200">

<br><br>
<input id="code">
<button onclick="step3()">Valider 2FA</button>

<hr>

<h2>Connexion</h2>

<input id="l_user"><br>
<input id="l_pass"><br>
<button onclick="login1()">Login</button>

<br><br>
<img id="login_qr" width="200">

<br><br>
<input id="l_code">
<button onclick="login2()">Valider 2FA</button>

<script>

let currentUser = "";

async function createUser(){
    let u = document.getElementById("username").value;
    currentUser = u;

    let res = await fetch(`http://127.0.0.1:8000/create-user?username=${u}`, {method:"POST"});
    let data = await res.json();

    document.getElementById("qr_password").src = data.password_qr;
}

async function step2(){
    let p = document.getElementById("password").value;

    let res = await fetch(`http://127.0.0.1:8000/register-step2?username=${currentUser}&password=${p}`, {
        method: "POST"
    });

    let data = await res.json();

    console.log(data);

    document.getElementById("qr_2fa").src = data["2fa_qr"];
}
async function step3(){
    let code = document.getElementById("code").value;

    let res = await fetch(`http://127.0.0.1:8000/register-step3?username=${currentUser}&code=${code}`, {method:"POST"});
    let data = await res.json();

    alert(data.message || data.error);
}

async function login1(){
    let u = document.getElementById("l_user").value;
    let p = document.getElementById("l_pass").value;

    let res = await fetch(`http://127.0.0.1:8000/login-step1?username=${u}&password=${p}`, {method:"POST"});
    let data = await res.json();

    document.getElementById("login_qr").src = data["2fa_qr"];
}

async function login2(){
    let u = document.getElementById("l_user").value;
    let code = document.getElementById("l_code").value;

    let res = await fetch(`http://127.0.0.1:8000/login-step2?username=${u}&code=${code}`, {method:"POST"});
    let data = await res.json();

    alert(data.message || data.error);
}

</script>

</body>
</html>
